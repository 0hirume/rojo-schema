name: pages

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: Published release tag to deploy
        type: string

concurrency:
  group: publication
  queue: max

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.tag }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: set up nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c

      - name: resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RELEASE: ${{ inputs.release }}
        run: nu scripts/pages.nu resolve

  build:
    needs: resolve
    if: needs.resolve.outputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: set up schema compiler
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          minimum_release_age: 0s
          mise_toml: |
            [tools]
            "github:${{ github.repository }}" = "${{ needs.resolve.outputs.release }}"
          cache: false

      - name: set up nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c

      - name: build site
        run: nu scripts/pages.nu

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # verify the deployment source.
      pages: write # deploy the pages artifact.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
