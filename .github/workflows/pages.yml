name: pages

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: publication

permissions: {}

env:
  DOCS_REPOSITORY: Roblox/creator-docs
  ROJO_REPOSITORY: rojo-rbx/rojo
  TRACKER_REPOSITORY: MaximumADHD/Roblox-Client-Tracker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # persist immutable schema snapshots.
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: set up nushell
        uses: hustcer/setup-nu@913f2aa794632a1834b5a6b983bd21832177544b
        with:
          version: ">=0.116.0"

      - name: build site
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
          REPOSITORY: ${{ github.repository }}
          SNAPSHOT_BRANCH: snapshots
        run: nu scripts/pages.nu

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # verify the deployment source.
      pages: write # deploy the pages artifact.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
