name: pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/pages.html"
      - ".github/pages.nu"
      - ".github/workflows/pages.yml"
      - "src/**"
      - "tests/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "mise.toml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: pages

permissions: {}

defaults:
  run:
    shell: nu {0}

env:
  DOCS_REPOSITORY: Roblox/creator-docs
  ROJO_REPOSITORY: rojo-rbx/rojo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # persist immutable schema snapshots.
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: install nushell
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: aqua:nushell/nushell

      - name: clone sources
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: nu .github/pages.nu clone-sources

      - name: install rust nightly
        run: rustup toolchain install nightly --profile minimal

      - name: generate schemas
        run: >-
          cargo +nightly run --locked -- generate
          --rojo sources/rojo
          --docs sources/creator-docs

      - name: check schemas
        run: >-
          cargo +nightly run --locked -- check
          --rojo sources/rojo
          --docs sources/creator-docs

      - name: test
        env:
          ROJO_SCHEMA_DOCS: ${{ github.workspace }}/sources/creator-docs
          ROJO_SCHEMA_ROJO: ${{ github.workspace }}/sources/rojo
        run: cargo +nightly test --locked

      - name: store snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SNAPSHOT_BRANCH: snapshots
        run: nu .github/pages.nu snapshot

      - name: stage site
        run: nu .github/pages.nu stage

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # verify the deployment source.
      pages: write # deploy the pages artifact.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
