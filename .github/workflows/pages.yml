name: pages

on:
  push:
    branches:
      - main
    paths:
      - "dist/**"
  workflow_dispatch: {}

concurrency:
  group: pages

permissions: {}

defaults:
  run:
    shell: nu {0}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # update the github pages branch.
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: install nushell
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: aqua:nushell/nushell

      - name: deploy latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: source .github/pages.nu; main
