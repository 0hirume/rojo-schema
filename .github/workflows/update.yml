name: update-schemas

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-schemas

permissions: {}

defaults:
  run:
    shell: nu {0}

env:
  DOCS_REPOSITORY: Roblox/creator-docs
  ROJO_REPOSITORY: rojo-rbx/rojo
  UPDATE_BRANCH: update/schemas

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: install nushell
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: aqua:nushell/nushell

      - name: clone sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: source .github/update.nu; main "clone-sources"

      - name: install rust nightly
        run: rustup toolchain install nightly --profile minimal

      - name: generate schemas
        run: >-
          cargo +nightly run --locked -- generate
          --rojo sources/rojo
          --docs sources/creator-docs

      - name: check schemas
        run: >-
          cargo +nightly run --locked -- check
          --rojo sources/rojo
          --docs sources/creator-docs

      - name: detect changes
        id: changes
        run: source .github/update.nu; main "detect-changes"

      - name: open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: source .github/update.nu; main "open-pull-request"
