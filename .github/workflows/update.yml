name: update-schemas

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-schemas
  cancel-in-progress: false

permissions: {}

env:
  DOCS_REPOSITORY: Roblox/creator-docs
  ROJO_REPOSITORY: rojo-rbx/rojo
  UPDATE_BRANCH: update/schemas

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - name: clone generator
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh repo clone "$REPOSITORY" . -- --branch "$DEFAULT_BRANCH" --depth 1

      - name: install nushell
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: aqua:nushell/nushell@latest

      - name: clone sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: nu {0}
        run: nu .github/update.nu clone-sources

      - name: install rust nightly
        shell: nu {0}
        run: rustup toolchain install nightly --profile minimal

      - name: generate schemas
        shell: nu {0}
        run: >-
          cargo +nightly run --locked -- generate
          --rojo sources/rojo
          --docs sources/creator-docs

      - name: check schemas
        shell: nu {0}
        run: >-
          cargo +nightly run --locked -- check
          --rojo sources/rojo
          --docs sources/creator-docs

      - name: detect changes
        id: changes
        shell: nu {0}
        run: nu .github/update.nu detect-changes

      - name: open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: nu {0}
        run: nu .github/update.nu open-pull-request
