name: update-schemas

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-schemas
  cancel-in-progress: false

permissions: {}

env:
  DOCS_REPOSITORY: Roblox/creator-docs
  ROJO_REPOSITORY: rojo-rbx/rojo
  UPDATE_BRANCH: update/schemas

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - name: clone generator
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh repo clone "$REPOSITORY" . -- --branch "$DEFAULT_BRANCH" --depth 1

      - name: clone sources
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "$ROJO_REPOSITORY" sources/rojo -- --depth 1
          gh repo clone "$DOCS_REPOSITORY" sources/creator-docs -- --depth 1 --filter=blob:none --sparse
          git -C sources/creator-docs sparse-checkout set content/en-us/reference/engine

      - name: install rust nightly
        run: rustup toolchain install nightly --profile minimal

      - name: generate schemas
        run: >-
          cargo +nightly run --locked -- generate
          --rojo sources/rojo
          --docs sources/creator-docs

      - name: check schemas
        run: >-
          cargo +nightly run --locked -- check
          --rojo sources/rojo
          --docs sources/creator-docs

      - name: detect changes
        id: changes
        run: |
          if git diff --quiet -- dist; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add dist
          git commit -m "chore: update schemas"

          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
          fi
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

          if [[ "$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$UPDATE_BRANCH" \
            --base "$DEFAULT_BRANCH" \
            --state open \
            --json number \
            --jq length)" == "0" ]]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --head "$UPDATE_BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --title "chore: update schemas" \
              --body "Regenerates the schema artifacts from the latest Rojo and Creator Docs default branches."
          fi
