name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  draft:
    name: create draft
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release.
    steps:
      - name: create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes
          fi

  build:
    name: build ${{ matrix.target }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: .exe
          - runner: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            suffix: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            suffix: ""
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # upload this target's release assets.
    defaults:
      run:
        shell: bash
    steps:
      - name: clone tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh repo clone "$REPOSITORY" . -- --branch "$RELEASE_TAG" --depth 1

      - name: install nushell
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: aqua:nushell/nushell@latest

      - name: install rust nightly
        env:
          TARGET: ${{ matrix.target }}
        shell: nu {0}
        run: rustup toolchain install nightly --profile minimal --target $env.TARGET

      - name: build
        env:
          TARGET: ${{ matrix.target }}
        shell: nu {0}
        run: cargo +nightly build --release --locked --target $env.TARGET

      - name: package
        env:
          ARCHIVE: ${{ matrix.archive }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        shell: nu {0}
        run: nu .github/release.nu package

      - name: upload binary
        env:
          ARCHIVE: ${{ matrix.archive }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        shell: nu {0}
        run: nu .github/release.nu upload

  publish:
    name: publish
    needs:
      - draft
      - build
      - pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the completed draft release.
    steps:
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh release edit "$RELEASE_TAG"
          --repo "$REPOSITORY"
          --draft=false
          --latest

  pages:
    name: deploy schemas
    needs:
      - draft
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write # update the github pages branch.
    steps:
      - name: clone release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh repo clone "$REPOSITORY" . -- --branch "$RELEASE_TAG" --depth 1

      - name: install nushell
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: aqua:nushell/nushell@latest

      - name: update pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: nu {0}
        run: nu .github/release.nu pages
