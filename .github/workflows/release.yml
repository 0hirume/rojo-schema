name: release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('release-{0}', github.ref) }}
  queue: max

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: set up dist
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          minimum_release_age: 0s
          install_args: aqua:axodotdev/cargo-dist
          cache: false

      - name: set up nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c

      - name: plan release
        id: plan
        run: nu scripts/release.nu plan

  build:
    name: build release
    needs: plan
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: set up dist
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          minimum_release_age: 0s
          install_args: aqua:axodotdev/cargo-dist
          cache: false

      - name: set up nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c

      - name: build archive
        id: artifacts
        run: nu scripts/release.nu archive

      - name: upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.artifacts.outputs.paths }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: set up dist
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          minimum_release_age: 0s
          install_args: aqua:axodotdev/cargo-dist
          cache: false

      - name: set up nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c

      - name: download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: archive-*
          path: target/distrib
          merge-multiple: true

      - name: build checksums
        run: nu scripts/release.nu package

      - name: publish release
        run: nu scripts/release.nu publish


  refresh:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: refresh pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run pages.yml --ref "$DEFAULT_BRANCH" --field release="$RELEASE_TAG"
