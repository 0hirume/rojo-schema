name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release

permissions: {}

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: .exe
          - runner: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            suffix: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            suffix: ""
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          cache: false
          install_args: aqua:nushell/nushell rust

      - name: build and package binary
        env:
          ARCHIVE: ${{ matrix.archive }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: mise run release:build

      - name: upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  test:
    name: test release binary
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCS_REPOSITORY: Roblox/creator-docs
      ROJO_REPOSITORY: rojo-rbx/rojo
      TRACKER_REPOSITORY: MaximumADHD/Roblox-Client-Tracker
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          cache: false
          install_args: aqua:nushell/nushell gh

      - name: download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-x86_64-unknown-linux-gnu

      - name: test release binary
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: mise run release:test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tested release.
      actions: write # trigger the Pages refresh after publishing.
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          cache: false
          install_args: aqua:nushell/nushell gh

      - name: download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: publish release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: mise run release:publish
