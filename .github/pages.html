<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>rojo-schema snapshots</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #0c0d10;
        color: #f4f4f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(56rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 5rem 0;
      }

      header,
      section {
        margin-bottom: 3rem;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0.75rem;
        font-size: clamp(2.25rem, 7vw, 4.5rem);
        letter-spacing: -0.055em;
      }

      h2 {
        margin-bottom: 1rem;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      p,
      time,
      code,
      #count {
        color: #a1a1aa;
      }

      a {
        color: #f4f4f5;
        text-underline-offset: 0.22em;
      }

      .label {
        margin-bottom: 1rem;
        color: #84cc16;
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }

      .card,
      li {
        border: 1px solid #27272a;
        border-radius: 0.75rem;
        background: #121317;
      }

      .card {
        padding: 1.25rem;
      }

      ol {
        display: grid;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1rem;
        padding: 1rem 1.25rem;
      }

      .meta {
        display: grid;
        gap: 0.3rem;
        min-width: 0;
      }

      code {
        overflow: hidden;
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 0.8rem;
        text-overflow: ellipsis;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.9rem;
      }

      @media (max-width: 36rem) {
        main {
          padding: 3rem 0;
        }

        li {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="label">rojo-schema</p>
        <h1>Schema snapshots</h1>
        <p>
          The current upstream schemas and immutable snapshots created whenever their generated
          bytes change.
        </p>
      </header>

      <section>
        <h2>Latest</h2>
        <div class="card">
          <div class="links">
            <a href="./latest/project.schema.json">project</a>
            <a href="./latest/model.schema.json">model</a>
            <a href="./latest/manifest.json">manifest</a>
            <a href="./latest/coverage.json">coverage</a>
          </div>
        </div>
      </section>

      <section>
        <div class="heading">
          <h2>Snapshots</h2>
          <span id="count"></span>
        </div>
        <ol id="snapshots">
          <li>Loading snapshots…</li>
        </ol>
      </section>
    </main>

    <script type="module">
      const list = document.querySelector("#snapshots");
      const count = document.querySelector("#count");

      function addLink(container, base, name, file) {
        const link = document.createElement("a");
        link.href = `${base}/${file}`;
        link.textContent = name;
        container.append(link);
      }

      function render(entry) {
        const item = document.createElement("li");
        const meta = document.createElement("div");
        const id = document.createElement("code");
        const time = document.createElement("time");
        const links = document.createElement("div");
        const base = `./snapshots/${encodeURIComponent(entry.id)}`;

        meta.className = "meta";
        links.className = "links";
        id.textContent = entry.id;
        time.dateTime = entry.createdAt;
        time.textContent = new Date(entry.createdAt).toLocaleString();
        const schemas = entry.artifacts?.filter((file) => file.endsWith(".schema.json")) ?? [
          "rojo.schema.json",
        ];
        for (const schema of schemas) {
          addLink(links, base, schema.split(".")[0], schema);
        }
        addLink(links, base, "manifest", "manifest.json");
        addLink(links, base, "coverage", "coverage.json");
        meta.append(id, time);
        item.append(meta, links);
        return item;
      }

      try {
        const response = await fetch("./snapshots/index.json");
        if (!response.ok) {
          throw new Error(`snapshot index returned ${response.status}`);
        }

        const index = await response.json();
        list.replaceChildren(...index.snapshots.map(render));
        count.textContent = `${index.snapshots.length} total`;
      } catch (error) {
        list.replaceChildren();
        const item = document.createElement("li");
        item.textContent = error.message;
        list.append(item);
      }
    </script>
  </body>
</html>
