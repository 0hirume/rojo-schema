[package]
name = "rojo-schema"
version = "0.1.1"
edition = "2024"
description = "Deterministic JSON Schema compiler for Rojo project and model files"
homepage = "https://0hirume.github.io/rojo-schema"
repository = "https://github.com/0hirume/rojo-schema"
license = "MIT OR Apache-2.0"
keywords = ["json-schema", "roblox", "rojo"]
categories = ["config", "development-tools"]
publish = false

[package.metadata.dist]
dist = true

[dependencies]
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
console = "0.16"
eyre = "0.6"
htmd = "0.5"
indicatif = "0.18"
miette = { version = "7", default-features = false, features = ["derive", "fancy-no-syscall"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-cmark-to-cmark = "23"
rbx_reflection = "7"
rbx_types = { version = "3", features = ["serde"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde-reflection = "0.6"
syn = { version = "3", features = ["full", "parsing", "visit"] }
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = { version = "0.1", default-features = false, features = ["attributes", "std"] }
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "registry"] }
url = "2"
yaml_serde = "0.10"

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
assertions_on_result_states = "deny"
branches_sharing_code = "deny"
clear_with_drain = "deny"
clone_on_ref_ptr = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
definition_in_module_root = "deny"
derive_partial_eq_without_eq = "deny"
fallible_impl_from = "deny"
inline_modules = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
redundant_clone = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
self_named_module_files = "deny"
single_char_lifetime_names = "deny"
unneeded_field_pattern = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
use_self = "deny"
verbose_file_reads = "deny"

too_many_lines = "allow"

[lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
warnings = { level = "deny", priority = -1 }

missing_docs = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
