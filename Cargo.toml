[package]
name = "rojo-schema"
version = "0.4.0"
edition = "2024"
description = "Deterministic JSON Schema compiler for Rojo project and model files"
homepage = "https://0hirume.github.io/rojo-schema"
repository = "https://github.com/0hirume/rojo-schema"
license = "MIT OR Apache-2.0"
keywords = ["json-schema", "roblox", "rojo"]
categories = ["config", "development-tools"]
publish = false

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
rbx_dom_weak = "4"
rbx_reflection = "7"
rbx_types = { version = "3", features = ["serde"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-reflection = "0.6"
serde_yaml = "0.9"
sha2 = "0.11"
syn = { version = "3", features = ["full", "parsing", "visit"] }
toml = "1"

[dev-dependencies]
jsonschema = { version = "0", default-features = false }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
