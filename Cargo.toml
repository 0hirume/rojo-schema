[package]
name = "rojo-schema"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "Deterministic JSON Schema compiler for Rojo project files"
homepage = "https://0hirume.github.io/rojo-schema"
repository = "https://github.com/0hirume/rojo-schema"
license = "MIT OR Apache-2.0"
keywords = ["json-schema", "roblox", "rojo"]
categories = ["config", "development-tools"]

[package.metadata.release]
publish = false

[lib]
name = "rojo_schema"
path = "src/lib.rs"

[[bin]]
name = "rojo-schema"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
rbx_dom_weak = "4"
rbx_reflection = "7"
rbx_reflection_database = {
  version = "3",
  features = ["debug_always_use_bundled"]
}
rbx_types = { version = "3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-reflection = "0.6"
serde_yaml = "0.9"
sha2 = "0.11"
syn = { version = "3", features = ["full", "parsing", "visit"] }
toml = "1"

[dev-dependencies]
jsonschema = { version = "0", default-features = false }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
